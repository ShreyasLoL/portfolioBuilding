<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f2f0eb" />
  <meta name="description" content="FORME — a slower, more considered way to meet someone." />
  <title>FORME — Find your person</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="app-shell">
    <header class="topbar">
      <a class="wordmark" href="#discover" aria-label="FORME home"><span class="wordmark-main">FORME</span><span class="wordmark-period">.</span><span class="wordmark-sub">MEET WITH INTENTION</span></a>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-link active" data-view="discover"><span class="nav-index">01</span>Discover</button>
        <button class="nav-link" data-view="likes"><span class="nav-index">02</span>Likes <span class="nav-count" id="likes-count">0</span></button>
        <button class="nav-link" data-view="messages"><span class="nav-index">03</span>Messages <span class="nav-dot"></span></button>
      </nav>
      <div class="topbar-right">
        <span class="availability"><i></i> BENGALURU, IN</span>
        <button class="user-menu" id="profile-menu" aria-label="Open your profile"><span class="user-initials">S</span><span class="user-chevron">⌄</span></button>
      </div>
      <button class="mobile-menu" id="mobile-menu" aria-label="Open navigation">☰</button>
    </header>

    <main id="app" class="view-transition" aria-live="polite"></main>

    <footer class="site-footer">
      <span>FORME® — A MORE HUMAN WAY TO MEET.</span>
      <span class="footer-centre">MADE FOR THE MEANINGFUL IN-BETWEEN.</span>
      <span>© 2026 <span class="footer-mark">✳</span></span>
    </footer>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="toast-root" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
